<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOUNG COACH 관리자 편집도구</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#101828;font-family:Inter,"Noto Sans KR",sans-serif}.wrap{max-width:1100px;margin:auto;padding:36px 20px 80px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.head h1{margin:0;font-size:34px}.head p{margin:5px 0;color:#667085}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;margin-bottom:18px}.panel h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:11px 12px;background:white}.field textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.item{border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin:12px 0;background:#fcfcfd}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid #d0d5dd;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.btn.primary{background:#101828;color:#fff;border-color:#101828}.btn.danger{color:#b42318}.sticky{position:sticky;bottom:12px;background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:12px;display:flex;gap:10px;justify-content:flex-end;box-shadow:0 8px 30px rgba(16,24,40,.12)}.note{background:#eff8ff;border-left:4px solid #2e90fa;padding:14px 16px;margin-bottom:18px;font-size:14px;color:#344054}.muted{color:#667085;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.sticky{flex-wrap:wrap}}
</style></head><body><div class="wrap"><div class="head"><div><h1>홈페이지 ver 3 · 관리자 편집도구</h1><p>글·활동·프로필을 수정하고 새 content.js를 내려받습니다.</p></div><a class="btn" href="index.html">홈페이지 보기</a></div>
<div class="note"><b>사용법:</b> 아래 내용을 수정 → 맨 아래 <b>content.js 다운로드</b> → 기존 홈페이지 폴더의 <b>content.js를 새 파일로 교체</b> → GitHub에 업로드/커밋. 사진은 <b>assets/images</b> 폴더에 넣고 파일명만 입력하세요.</div>
<div id="editor"></div><div class="sticky"><button class="btn" id="resetBtn">현재 content.js 다시 불러오기</button><button class="btn primary" id="downloadBtn">content.js 다운로드</button></div></div>
<script src="content.js"></script><script>
let data=JSON.parse(JSON.stringify(window.SITE_CONTENT)); const root=document.getElementById('editor'); const f=(label,path,val,type='text')=>`<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(val)}</textarea>`:`<input data-path="${path}" value="${esc(val)}">`}</div>`; function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){root.innerHTML=`<section class="panel"><h2>1. 프로필</h2><div class="grid">${f('한글 이름','profile.nameKo',data.profile.nameKo)}${f('영문 이름','profile.nameEn',data.profile.nameEn)}${f('역할 문구','profile.roles',data.profile.roles)}${f('프로필 사진 경로','profile.photo',data.profile.photo)}${f('메인 문장','profile.headline',data.profile.headline,'textarea')}${f('소개 문장','profile.intro',data.profile.intro,'textarea')}</div><p class="muted">예: assets/images/profile.jpg</p></section>
<section class="panel"><h2>2. 생각과 철학</h2><div class="grid">${f('제목','philosophy.title',data.philosophy.title,'textarea')}${f('본문','philosophy.body',data.philosophy.body,'textarea')}</div></section>
<section class="panel"><div class="row"><h2>3. 활동</h2><button class="btn" data-add="activities">+ 활동 추가</button></div>${data.activities.map((x,i)=>`<div class="item"><div class="row"><b>활동 ${i+1}</b><button class="btn danger" data-remove="activities.${i}">삭제</button></div><div class="grid">${f('날짜',`activities.${i}.date`,x.date)}${f('분류',`activities.${i}.category`,x.category)}${f('제목',`activities.${i}.title`,x.title,'textarea')}${f('사진 경로',`activities.${i}.image`,x.image)}${f('설명',`activities.${i}.desc`,x.desc,'textarea')}</div></div>`).join('')}</section>
<section class="panel"><div class="row"><h2>4. 글과 기록</h2><button class="btn" data-add="articles">+ 새 글 추가</button></div>${data.articles.map((x,i)=>`<div class="item"><div class="row"><b>글 ${i+1}</b><button class="btn danger" data-remove="articles.${i}">삭제</button></div><div class="grid">${f('날짜',`articles.${i}.date`,x.date)}${f('분류',`articles.${i}.category`,x.category)}${f('제목',`articles.${i}.title`,x.title,'textarea')}${f('한 줄 요약',`articles.${i}.summary`,x.summary,'textarea')}${f('본문',`articles.${i}.body`,x.body,'textarea')}</div></div>`).join('')}</section>
<section class="panel"><h2>5. 연락처</h2><div class="grid">${f('안내 문구','contact.message',data.contact.message,'textarea')}${f('이메일','contact.email',data.contact.email)}${f('LinkedIn URL','contact.linkedin',data.contact.linkedin)}</div></section>`}
function setPath(path,value){const p=path.split('.');let o=data;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=value}
root.addEventListener('input',e=>{if(e.target.dataset.path)setPath(e.target.dataset.path,e.target.value)});root.addEventListener('click',e=>{const add=e.target.dataset.add,rem=e.target.dataset.remove;if(add==='articles'){data.articles.unshift({date:new Date().toISOString().slice(0,10).replaceAll('-','.'),category:'',title:'',summary:'',body:''});render()}if(add==='activities'){data.activities.unshift({date:'',category:'',title:'',desc:'',image:'assets/images/'});render()}if(rem){const [k,i]=rem.split('.');data[k].splice(Number(i),1);render()}});
document.getElementById('downloadBtn').onclick=()=>{const blob=new Blob(['window.SITE_CONTENT = '+JSON.stringify(data,null,2)+';\n'],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='content.js';a.click();URL.revokeObjectURL(a.href)};document.getElementById('resetBtn').onclick=()=>{data=JSON.parse(JSON.stringify(window.SITE_CONTENT));render()};render();
</script></body></html>
