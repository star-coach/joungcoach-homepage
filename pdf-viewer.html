<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원문 PDF 열람 | JOUNG COACH</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:system-ui,'Noto Sans KR',sans-serif;color:#243247}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;padding:10px 14px;border-bottom:1px solid #dce1e8}header b{font-size:14px}header small{color:#667}button{background:#e5edf5;border:0;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}#status{text-align:center;padding:12px;font-size:13px}#pages{max-width:1000px;margin:auto;padding:8px;display:grid;gap:12px}.page{background:#fff;box-shadow:0 1px 8px #0002;text-align:center;overflow:auto}.page img,.page canvas{display:block;margin:auto;width:100%;height:auto;max-width:none}.page small{display:block;padding:7px;font-size:11px;color:#666}#fallback{display:none;padding:10px;text-align:center}#fallback iframe{width:100%;height:78vh;border:1px solid #dce1e8;background:white}#fallback a{color:#174ea6;font-size:13px}#fallback p{font-size:13px}@media(max-width:600px){#pages{padding:0;gap:8px}.page{box-shadow:none}}@media print{body{display:none!important}}
</style></head><body><header><b>원문 PDF 열람</b><div><button id="minus" aria-label="축소">−</button> <span id="zoom">100%</span> <button id="plus" aria-label="확대">+</button></div></header><div id="status" role="status">원문을 불러오는 중입니다…</div><main id="pages"></main><div id="fallback"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import {firebaseConfig} from './firebase-config.js';
const params=new URLSearchParams(location.search),collection=params.get('collection'),id=params.get('id');
const status=document.getElementById('status'),root=document.getElementById('pages'),fallback=document.getElementById('fallback');
const supported=['columns','research','articles','activities','areas','nowEntries'];
let zoom=1,pages=[],pdf=null,source='';
function url(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return''}}
function fallbackNative(reason){
 status.textContent=reason;
 root.replaceChildren();fallback.style.display='block';fallback.replaceChildren();
 const message=document.createElement('p');
 message.textContent='현재 등록된 원문은 휴대폰에서 바로 읽을 수 있는 페이지 이미지가 없습니다. 관리자에서 해당 글을 열고 같은 PDF 파일을 다시 등록·저장하면 다운로드 없이 볼 수 있습니다.';
 fallback.append(message);
}

async function render(){document.getElementById('zoom').textContent=Math.round(zoom*100)+'%';if(!pages.length&&!pdf)return;root.replaceChildren();fallback.style.display='none';if(pages.length){for(let i=0;i<pages.length;i++){const section=document.createElement('section');section.className='page';const img=document.createElement('img');img.loading=i<2?'eager':'lazy';img.alt=(i+1)+'페이지';img.src=pages[i];img.style.width=(zoom*100)+'%';img.style.maxWidth='none';const label=document.createElement('small');label.textContent=(i+1)+' / '+pages.length+' 페이지';section.append(img,label);root.append(section)}status.textContent=pages.length+'페이지 · 다운로드 없이 바로 열람';return}for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),base=page.getViewport({scale:1}),width=Math.min(950,Math.max(290,root.clientWidth-12));const viewport=page.getViewport({scale:width/base.width*zoom});const section=document.createElement('section');section.className='page';const canvas=document.createElement('canvas');const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.ceil(viewport.width*ratio);canvas.height=Math.ceil(viewport.height*ratio);canvas.style.width=Math.ceil(viewport.width)+'px';section.append(canvas);const label=document.createElement('small');label.textContent=i+' / '+pdf.numPages+' 페이지';section.append(label);root.append(section);await page.render({canvasContext:canvas.getContext('2d'),viewport,transform:ratio===1?undefined:[ratio,0,0,ratio,0,0]}).promise}status.textContent=pdf.numPages+'페이지 · PDF 열람'}
async function start(){try{if(!supported.includes(collection)||!id||!/^[-\w]+$/.test(id))throw Error('문서 주소가 올바르지 않습니다.');const snap=await get(ref(getDatabase(initializeApp(firebaseConfig)),`homepage/${collection}/${id}`));const data=snap.val();if(!data)throw Error('해당 게시글을 찾지 못했습니다.');if(data.published===false)throw Error('공개되지 않은 게시글입니다.');source=url(data.pdfUrl);pages=Array.isArray(data.pdfPages)?data.pdfPages.filter(url):Object.values(data.pdfPages||{}).filter(url);if(pages.length){await render();return}if(!source)throw Error('PDF 파일 주소가 없습니다.');try{const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';pdf=await lib.getDocument({url:source,withCredentials:false}).promise;await render()}catch(e){console.warn('PDF.js failed; switching to native viewer',e);fallbackNative('PDF 원문을 화면에 표시하지 못했습니다. 열람용 이미지를 다시 생성해야 합니다.')}}catch(e){status.textContent='원문을 불러오지 못했습니다: '+e.message;console.error(e)}}
document.getElementById('minus').onclick=()=>{zoom=Math.max(.75,+(zoom-.25).toFixed(2));render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2.5,+(zoom+.25).toFixed(2));render()};window.addEventListener('resize',()=>{clearTimeout(window.__pdfresize);window.__pdfresize=setTimeout(render,350)});start();
</script></body></html>
