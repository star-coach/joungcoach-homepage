<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원문 PDF 열람 | JOUNG COACH</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:system-ui,'Noto Sans KR',sans-serif;color:#243247}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;justify-content:space-between;background:#fff;padding:10px 14px;border-bottom:1px solid #dce1e8}header b{font-size:14px}header small{font-size:12px;color:#667}button{background:#e5edf5;border:0;padding:9px 12px;border-radius:8px;font-weight:700}#status{text-align:center;padding:10px;font-size:13px}#pages{max-width:1000px;margin:auto;padding:8px;display:grid;gap:12px}.page{position:relative;background:#fff;box-shadow:0 1px 8px #0002;padding:0;overflow:auto}.page canvas{display:block;width:100%;height:auto}.page small{display:block;padding:7px;font-size:11px;color:#666}@media(max-width:600px){#pages{padding:0;gap:8px}.page{box-shadow:none}}@media print{body{display:none!important}}</style></head><body><header><b>원문 PDF 열람</b><div><button id="minus" aria-label="축소">−</button> <span id="zoom">100%</span> <button id="plus" aria-label="확대">+</button></div></header><div id="status" role="status">원문을 불러오는 중입니다…</div><main id="pages"></main><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';const params=new URLSearchParams(location.search);const source=params.get('src');const status=document.getElementById('status'),root=document.getElementById('pages');let pdf,zoom=1;function safePdfUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.toString():null}catch{return null}}async function render(){if(!pdf)return;document.getElementById('zoom').textContent=Math.round(zoom*100)+'%';root.replaceChildren();for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n);const available=Math.min(940,Math.max(280,root.clientWidth-8));const base=pg.getViewport({scale:1});const scale=available/base.width*zoom;const view=pg.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2);const card=document.createElement('section');card.className='page';const canvas=document.createElement('canvas');canvas.width=Math.round(view.width*ratio);canvas.height=Math.round(view.height*ratio);canvas.style.width=Math.round(view.width)+'px';canvas.style.maxWidth='none';const info=document.createElement('small');info.textContent=n+' / '+pdf.numPages+' 페이지';card.append(canvas,info);root.append(card);const ctx=canvas.getContext('2d');await pg.render({canvasContext:ctx,viewport:view,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;}status.textContent=pdf.numPages+'페이지 · 화면에 맞춰 열람 중';}const url=safePdfUrl(source);if(!url){status.textContent='올바른 PDF 주소가 없습니다.'}else{try{pdf=await pdfjsLib.getDocument({url,withCredentials:false}).promise;await render()}catch(e){status.textContent='PDF를 열지 못했습니다. Firebase Storage 열람 권한과 파일 주소를 확인해 주세요.';console.error(e)}}document.getElementById('minus').onclick=()=>{zoom=Math.max(.75,+(zoom-.25).toFixed(2));render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2.5,+(zoom+.25).toFixed(2));render()};window.addEventListener('resize',()=>{clearTimeout(window.__pdfresize);window.__pdfresize=setTimeout(render,350)});</script></body></html>
